[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envsyncer"
version = "0.1.0"
description = "Effortless, cross-platform sync of developer secret files to a private GitHub vault."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EnvSyncer" }]
keywords = ["secrets", "dotenv", "env", "sync", "github", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "requests>=2.31",
    "pathspec>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[project.urls]
Homepage = "https://github.com/your-org/envsyncer"
Repository = "https://github.com/your-org/envsyncer"

[project.scripts]
envsyncer = "envsyncer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/envsyncer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
